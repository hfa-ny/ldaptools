name: PHP compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ldap, mbstring, intl
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-plugins --no-scripts
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test:php8
      - run: php bin/phpspec run --no-interaction --no-code-generation --format=dot
